preset_id: sport_highlight_impact
name: "Sport Highlight Impact"
emoji: "🏆"
description: "Структурированная нарезка лучших моментов. Ищет кульминационные фрагменты, добавляет замедление на импактных моментах, разгон скорости между ними. Для хайлайтов матчей, соревнований, горного велосипеда."
recommended_for:
  - "хайлайты матчей"
  - "соревнования"
  - "горный велосипед и мотокросс"
  - "командные виды спорта"
  - "спортивные шоурилы"

settings:
  dynamic_level: fast

  clip_selection:
    segment_min_duration: 0.6
    segment_max_duration: 3.5

  transitions:
    enabled: true
    type: flash
    duration: 0.28
    randomize: true

  speed_effects:
    enabled: true
    mode: speed_ramp
    slow_motion_factor: 0.40
    speed_up_factor: 1.80
    intensity: high

  color:
    enabled: true
    style: high_contrast
    intensity: medium

  music_sync:
    enabled: true
    mode: dynamic_sync

  quality_filters:
    enabled: true
    remove_blurry: true
    remove_dark: true
    remove_shaky: false
    stabilization: none

  audio_selection:
    enabled: true
    mode: auto_highlight
    manual_start: null
    manual_end: null
    avoid_intro: true
    avoid_intro_seconds: 4.0
    avoid_last_seconds: true
    avoid_last_seconds_count: 4.0
    analysis_window_sec: 8.0
    hop_sec: 1.0
    prefer_energy: true
    prefer_stability: false
    prefer_climax: true
    fade_in: 0.5
    fade_out: 0.8
    loop_audio_if_short: true
    fallback_mode: auto_energy

  framing:
    output_format: original
    fit_mode: fill
    allow_crop: true
    avoid_black_bars: true
    crop_position: center

  export:
    format: original
    quality: balanced
    hardware_acceleration: auto
