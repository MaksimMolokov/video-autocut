preset_id: sport_dynamic_cut
name: "Sport Dynamic Cut"
emoji: "🏃"
description: "Сверхдинамичный ритмичный монтаж. Короткие резкие склейки в темп музыки, скоростные эффекты, высокий контраст. Для экшн-спорта, тренировок, Reels."
recommended_for:
  - "спорт и фитнес"
  - "экшн-видео"
  - "тренировки и кроссфит"
  - "скейт, BMX, паркур"
  - "Reels, Shorts, TikTok"

settings:
  dynamic_level: fast

  clip_selection:
    segment_min_duration: 0.4
    segment_max_duration: 1.2

  transitions:
    enabled: true
    type: flash
    duration: 0.22
    randomize: false

  speed_effects:
    enabled: true
    mode: speed_ramp
    slow_motion_factor: 0.50
    speed_up_factor: 2.00
    intensity: high

  color:
    enabled: true
    style: high_contrast
    intensity: high

  music_sync:
    enabled: true
    mode: beat_sync

  quality_filters:
    enabled: true
    remove_blurry: true
    remove_dark: true
    remove_shaky: false
    stabilization: none

  audio_selection:
    enabled: true
    mode: auto_energy
    manual_start: null
    manual_end: null
    avoid_intro: true
    avoid_intro_seconds: 3.0
    avoid_last_seconds: true
    avoid_last_seconds_count: 3.0
    analysis_window_sec: 6.0
    hop_sec: 1.0
    prefer_energy: true
    prefer_stability: false
    prefer_climax: true
    fade_in: 0.3
    fade_out: 0.5
    loop_audio_if_short: true
    fallback_mode: auto_highlight

  framing:
    output_format: original
    fit_mode: fill
    allow_crop: true
    avoid_black_bars: true
    crop_position: center

  export:
    format: original
    quality: balanced
    hardware_acceleration: auto
