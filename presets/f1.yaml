preset_id: f1
name: "F1"
emoji: "🏎"
description: "Динамичный монтаж под быстрый ритм с эффектным вступлением из нескольких вертикальных видеополос, сверхбыстрой нарезкой кадров и энергичной сменой фрагментов под музыку."
recommended_for:
  - "автоспорт"
  - "экшн-видео"
  - "динамичный монтаж"
  - "Reels, Shorts, TikTok"
  - "быстрая музыка"

settings:
  dynamic_level: fast

  clip_selection:
    # Micro-clips (0.1s) for the intro rapid-cut are rendered directly by
    # f1_renderer.py from candidate start positions — these limits apply only
    # to the main-edit body where clips must be long enough to be watchable.
    segment_min_duration: 1.5
    segment_max_duration: 4.5

  transitions:
    enabled: true
    type: flash
    duration: 0.15
    randomize: true

  speed_effects:
    enabled: true
    mode: speed_ramp
    slow_motion_factor: 0.5
    speed_up_factor: 2.5
    intensity: high

  color:
    enabled: true
    style: high_contrast
    intensity: high

  music_sync:
    enabled: true
    mode: beat_sync

  quality_filters:
    enabled: true
    remove_blurry: true
    remove_dark: true
    remove_shaky: false
    stabilization: none

  audio_selection:
    enabled: true
    mode: auto_energy
    manual_start: null
    manual_end: null
    avoid_intro: true
    avoid_intro_seconds: 3.0
    avoid_last_seconds: true
    avoid_last_seconds_count: 3.0
    analysis_window_sec: 6.0
    hop_sec: 1.0
    prefer_energy: true
    prefer_stability: false
    prefer_climax: true
    fade_in: 0.3
    fade_out: 0.5
    loop_audio_if_short: true
    fallback_mode: auto_highlight

  framing:
    output_format: vertical_9_16
    resolution: "1080x1920"
    fit_mode: fill
    allow_crop: true
    avoid_black_bars: true
    crop_position: center

  export:
    format: vertical_9_16
    resolution: "1080x1920"
    quality: balanced
    hardware_acceleration: auto
