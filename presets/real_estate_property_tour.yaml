preset_id: real_estate_property_tour
name: "Real Estate / Property Tour"
emoji: "🏡"
description: "Плавный понятный монтаж для недвижимости, квартир, домов, участков, интерьеров и коммерческих объектов."
recommended_for:
  - "недвижимость"
  - "квартиры и дома"
  - "участки"
  - "интерьеры и экстерьеры"
  - "обзор коммерческих объектов"

settings:
  dynamic_level: slow
  
  clip_selection:
    segment_min_duration: 3.5
    segment_max_duration: 8.0
  
  transitions:
    enabled: true
    type: crossfade
    duration: 1.2
    randomize: false
  
  speed_effects:
    enabled: true
    mode: slow_motion
    slow_motion_factor: 0.9
    speed_up_factor: 1.1
    intensity: light  # normalized from "low"
  
  color:
    enabled: true
    style: clean_bright
    intensity: medium
  
  music_sync:
    enabled: true
    mode: simple_tempo
  
  quality_filters:
    enabled: true
    remove_blurry: true
    remove_dark: true
    remove_shaky: true
    stabilization: medium  # normalized from "high" - not supported
  
  audio_selection:
    enabled: true
    mode: auto_balanced
    manual_start: null
    manual_end: null
    avoid_intro: true
    avoid_intro_seconds: 5.0
    avoid_last_seconds: true
    avoid_last_seconds_count: 5.0
    analysis_window_sec: 12.0
    hop_sec: 2.0
    prefer_energy: false
    prefer_stability: true
    prefer_climax: false
    fade_in: 1.5
    fade_out: 2.0
    loop_audio_if_short: true
    fallback_mode: auto_balanced
  
  framing:
    output_format: horizontal_16_9
    resolution: "1920x1080"
    fit_mode: fill
    allow_crop: true
    avoid_black_bars: true
    crop_position: center
  
  export:
    format: horizontal_16_9
    resolution: "1920x1080"
    quality: high
    hardware_acceleration: auto
