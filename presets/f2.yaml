preset_id: f2
name: "F2 Cinematic Velocity Flow"
emoji: "🎬"
description: "Плавный cinematic-монтаж с speed ramp переходами, движением камеры и музыкальным flow."
recommended_for:
  - "drone"
  - "fpv"
  - "travel"
  - "city"
  - "nature"
  - "real estate"
  - "lifestyle"

settings:
  dynamic_level: balanced

  clip_selection:
    segment_min_duration: 2.2
    segment_max_duration: 4.5

  transitions:
    enabled: true
    type: speed_ramp
    duration: 0.6
    randomize: true

  speed_effects:
    enabled: true
    mode: speed_ramp
    slow_motion_factor: 0.65
    speed_up_factor: 1.8
    intensity: medium

  color:
    enabled: true
    style: cinematic_warm
    intensity: medium

  music_sync:
    enabled: true
    mode: dynamic_sync

  quality_filters:
    enabled: true
    remove_blurry: true
    remove_dark: true
    remove_shaky: true
    stabilization: medium

  audio_selection:
    enabled: true
    mode: auto_dynamic
    manual_start: null
    manual_end: null
    avoid_intro: true
    avoid_intro_seconds: 5.0
    avoid_last_seconds: true
    avoid_last_seconds_count: 5.0
    analysis_window_sec: 8.0
    hop_sec: 1.5
    prefer_energy: true
    prefer_stability: true
    prefer_climax: false
    fade_in: 1.2
    fade_out: 1.5
    loop_audio_if_short: true
    fallback_mode: auto_balanced

  framing:
    output_format: horizontal_16_9
    resolution: "1920x1080"
    fit_mode: fill
    allow_crop: true
    avoid_black_bars: true
    crop_position: center

  export:
    format: horizontal_16_9
    resolution: "1920x1080"
    quality: high
    hardware_acceleration: auto
