preset_id: fast_action_sport
name: "Fast Action Sport"
emoji: "⚡"
description: "Очень динамичный монтаж для спорта, движения, тренировок, велосипеда, бега и экстремальных кадров."
recommended_for:
  - "спорт"
  - "экшн-видео"
  - "тренировки"
  - "велосипед и бег"
  - "Reels, Shorts, TikTok"

settings:
  dynamic_level: fast
  
  clip_selection:
    segment_min_duration: 0.6
    segment_max_duration: 2.0
  
  transitions:
    enabled: true
    type: flash
    duration: 0.25
    randomize: true
  
  speed_effects:
    enabled: true
    mode: speed_ramp
    slow_motion_factor: 0.55
    speed_up_factor: 2.2
    intensity: high
  
  color:
    enabled: true
    style: high_contrast
    intensity: high
  
  music_sync:
    enabled: true
    mode: beat_sync
  
  quality_filters:
    enabled: true
    remove_blurry: true
    remove_dark: true
    remove_shaky: true
    stabilization: medium  # normalized from "high" - not supported
  
  audio_selection:
    enabled: true
    mode: auto_energy
    manual_start: null
    manual_end: null
    avoid_intro: true
    avoid_intro_seconds: 4.0
    avoid_last_seconds: true
    avoid_last_seconds_count: 4.0
    analysis_window_sec: 8.0
    hop_sec: 1.0
    prefer_energy: true
    prefer_stability: false
    prefer_climax: true
    fade_in: 0.5
    fade_out: 0.8
    loop_audio_if_short: true
    fallback_mode: auto_highlight
  
  framing:
    output_format: vertical_9_16
    resolution: "1080x1920"
    fit_mode: fill
    allow_crop: true
    avoid_black_bars: true
    crop_position: center
  
  export:
    format: vertical_9_16
    resolution: "1080x1920"
    quality: balanced
    hardware_acceleration: auto
