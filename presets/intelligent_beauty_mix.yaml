preset_id: intelligent_beauty_mix
name: "Intelligent Beauty Mix"
emoji: "🧠✨"
description: "Интеллектуальный монтаж для глубокого анализа видео: ищет красивые, стабильные, выразительные и разнообразные кадры, подбирает лучшие моменты под музыку и собирает более монтажный ролик."
recommended_for:
  - "универсальный красивый монтаж"
  - "дрон-съёмка"
  - "путешествия"
  - "город и природа"
  - "портфолио"
  - "лучший автоматический результат"

settings:
  dynamic_level: balanced

  clip_selection:
    segment_min_duration: 2.0
    segment_max_duration: 6.0

  clip_strategy:
    mode: intelligent_beauty
    # Веса для beauty scoring
    weight_sharpness: 1.4
    weight_brightness: 1.0
    weight_contrast: 0.9
    weight_motion: 0.6
    weight_stability: 1.3
    weight_visual_complexity: 1.1
    weight_uniqueness: 1.5
    weight_action: 0.7
    weight_calm: 1.0
    weight_technical_quality: 1.5

    # Правила отбора красивых кадров
    prefer_stable_clips: true
    prefer_long_clips: false
    prefer_high_motion: false
    avoid_shaky_clips: true
    avoid_static_clips: false

    # Beauty story arc
    ordering_type: beauty_story_arc

    # Высокое разнообразие
    diversity_enabled: true
    diversity_threshold: 0.45

    # Controlled randomness
    randomness_enabled: true
    randomness_level: 0.25

    # Избегать повторов
    avoid_previous_renders: true
    previous_usage_penalty: 0.6

  transitions:
    enabled: true
    type: crossfade
    duration: 0.6
    randomize: true

  speed_effects:
    enabled: true
    mode: slow_motion
    slow_motion_factor: 0.88
    speed_up_factor: 1.15
    intensity: light

  color:
    enabled: true
    style: cinematic_warm
    intensity: medium

  music_sync:
    enabled: true
    mode: dynamic_sync

  quality_filters:
    enabled: true
    remove_blurry: true
    remove_dark: true
    remove_shaky: true
    stabilization: medium

  audio_selection:
    enabled: true
    mode: auto_highlight
    manual_start: null
    manual_end: null
    avoid_intro: true
    avoid_intro_seconds: 8.0
    avoid_last_seconds: true
    avoid_last_seconds_count: 6.0
    analysis_window_sec: 2.0
    hop_sec: 0.5
    prefer_energy: true
    prefer_stability: true
    prefer_climax: true
    fade_in: 1.5
    fade_out: 2.5
    loop_audio_if_short: true
    fallback_mode: auto_balanced

  framing:
    output_format: original
    resolution: null
    fit_mode: fill
    allow_crop: true
    avoid_black_bars: true
    crop_position: center

  export:
    format: original
    resolution: null
    quality: high
    hardware_acceleration: auto
