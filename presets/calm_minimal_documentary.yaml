preset_id: calm_minimal_documentary
name: "Calm Minimal Documentary"
emoji: "🎬"
description: "Спокойный минималистичный монтаж для документальных, технических, обзорных и информативных видео."
recommended_for:
  - "документальные видео"
  - "технические обзоры"
  - "рабочие процессы"
  - "информативные ролики"
  - "спокойные объясняющие видео"

settings:
  dynamic_level: slow
  
  clip_selection:
    segment_min_duration: 4.0
    segment_max_duration: 10.0
  
  transitions:
    enabled: true
    type: fade
    duration: 1.0
    randomize: false
  
  speed_effects:
    enabled: false
    mode: none
    slow_motion_factor: 0.9
    speed_up_factor: 1.1
    intensity: light  # normalized from "low"
  
  color:
    enabled: true
    style: natural
    intensity: light  # normalized from "low"
  
  music_sync:
    enabled: true
    mode: simple_tempo
  
  quality_filters:
    enabled: true
    remove_blurry: true
    remove_dark: true
    remove_shaky: true
    stabilization: medium
  
  audio_selection:
    enabled: true
    mode: auto_balanced
    manual_start: null
    manual_end: null
    avoid_intro: true
    avoid_intro_seconds: 6.0
    avoid_last_seconds: true
    avoid_last_seconds_count: 6.0
    analysis_window_sec: 12.0
    hop_sec: 2.0
    prefer_energy: false
    prefer_stability: true
    prefer_climax: false
    fade_in: 2.0
    fade_out: 2.0
    loop_audio_if_short: true
    fallback_mode: auto_balanced
  
  framing:
    output_format: horizontal_16_9
    resolution: "1920x1080"
    fit_mode: fill
    allow_crop: true
    avoid_black_bars: true
    crop_position: center
  
  export:
    format: horizontal_16_9
    resolution: "1920x1080"
    quality: high
    hardware_acceleration: auto
