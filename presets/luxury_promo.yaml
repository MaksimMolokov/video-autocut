preset_id: luxury_promo
name: Luxury Promo
emoji: "✨"
description: Премиальный, плавный монтаж для кафе, отелей, бизнеса, недвижимости.
recommended_for: [кафе, отель, ресторан, бизнес, прomo, luxury, недвижимость, интерьер]
dynamic_level: slow

clip_selection:
  segment_min_duration: 3.0
  segment_max_duration: 8.0
  prefer_wide_shots: false
  prefer_stable: true
  prefer_detail_shots: true
  min_quality_score: 0.55     # higher quality bar for premium content

transitions:
  type: crossfade
  duration: 0.6
  randomize: false

speed_effects:
  enabled: false

color:
  style: premium
  saturation_boost: 0.05
  contrast_boost: 0.15
  warmth: 0.08
  vignette: 0.12

music_sync:
  mode: dynamic_sync
  cut_on_beat: false
  prefer_calm_sections: true

scoring_weights:
  sharpness: 1.5            # premium quality required
  stability: 1.3
  brightness: 1.1
  colorfulness: 0.9
  motion: 0.3               # calm, deliberate motion
  aesthetic_score: 1.8      # beauty of frame is critical
  composition_bonus: 1.5
  detail_shot_bonus: 1.0

segment_selection:
  preferred_scene_categories: [indoor, studio, architecture, product, detail_shot, business_location]
  preferred_camera_motion: [static, dolly, pan_left, pan_right, reveal, tilt_up]
  rejected_camera_motion: [shake, handheld, landing, takeoff, chaotic]
  min_scores:
    quality_score: 0.55
    composition_score: 0.50
    aesthetic_score: 0.50
  role_rules:
    intro:
      preferred_tags: [facade, exterior, establishing_shot, wide_shot]
      duration_sec: {min: 3, max: 6}
    main_part:
      preferred_tags: [interior, detail_shot, product, people_present]
    ending:
      preferred_tags: [exterior, facade, logo, wide_shot]
