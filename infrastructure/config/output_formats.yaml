# Output formats — independent of style and duration (TZ section 8)
# Format = aspect ratio + resolution + crop strategy

formats:

  youtube_shorts:
    id: youtube_shorts
    name: YouTube Shorts
    aspect_ratio: "9:16"
    width: 1080
    height: 1920
    fps: 30
    typical_duration: [15, 60]
    crop_strategy: smart     # face/saliency-based crop
    codec: h264
    bitrate: "8M"

  instagram_reels:
    id: instagram_reels
    name: Instagram Reels
    aspect_ratio: "9:16"
    width: 1080
    height: 1920
    fps: 30
    typical_duration: [15, 90]
    crop_strategy: smart
    codec: h264
    bitrate: "8M"

  tiktok:
    id: tiktok
    name: TikTok
    aspect_ratio: "9:16"
    width: 1080
    height: 1920
    fps: 30
    typical_duration: [10, 60]
    crop_strategy: smart
    codec: h264
    bitrate: "8M"

  youtube_horizontal:
