    aspect_ratio: "1:1"
    width: 1080
    height: 1080
    fps: 30
    typical_duration: [15, 60]
    crop_strategy: smart
    codec: h264
    bitrate: "8M"

  wide_cinematic:
    id: wide_cinematic
    name: Wide Cinematic 21:9
    aspect_ratio: "21:9"
    width: 2560
    height: 1080
    fps: 24
    typical_duration: [30, 9999]
